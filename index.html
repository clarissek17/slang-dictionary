        // detect searched word
        function search(){

            // variable declarations
            let term = document.getElementById('searchBar').value
            let results = document.getElementById('results')
            let filter = document.getElementById('filterBox').value


            // term to array
            let letters = term.split('')

            // clear results
            results.innerHTML = ""

            terms.forEach(word =>{
                word.match = 0;
            })

            // rank each word in the terms array
            letters.forEach(letter => {
                console.log(letter)

                terms.forEach(word => {

                    console.log(word.term)
                    if(word.term.includes(letter)){
                        
                        word.match = word.match + 1
                        console.log(word.term + word.match)

                    } // if

                }) // terms forEach

            }) // letters forEach

            // sort based on match
            terms.sort((a, b) => b.match - a.match)
            console.log(terms)

            // output

            terms.forEach(word => {
                let megaString = ""
                let wordDiv = document.createElement("div")

                if(word.derog == false || filter == "no"){
                    //megaString += "<span class='word'>" + word.term + "</span>   <span class='pronounce'>" + word.pronounce + "</span><br>"
                    megaString += "<span class='word'>" + word.term + "</span><br>"

                    word.define.forEach(thing => {

                        if(filter == "no" || !thing.includes("​")){ // invisible character
                            megaString += thing + "<br>"
                        }

                    })

                    wordDiv.innerHTML = megaString
                    results.appendChild(wordDiv)

                } // if

            }) // terms forEach word output

        } // search()

        function filter(){
            let filter = document.getElementById('filterBox')

            if(filter.value == "no"){
                filter.value = "yes"
            } else if (filter.value == "yes"){
                filter.value = "no"
            }

            console.log(filter.value)
        } // filter()
