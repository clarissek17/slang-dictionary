<!DOCTYPE html>
    <html lang="en">

    <!-- TO ADD
    - re add pronounciation once fixed
    - add new words
    - examples
    -->

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open Sans">
   
        <title>Gen Z + Gen A Slang Dictionary</title>
    
        <style>

            body{
                display: grid;
                place-items: center;
                font-family: "Open Sans", sans-serif;
            }

            #title{
                margin-top: 4vh;
                font-weight: bold;
                font-size: 5vh;
            }

            #subtitle{
                margin-top: 2vh;
                margin-bottom: 2vh;
            }

            #searchBar{
                margin-top: 2vh;
                min-width: 50vw;
                padding: 2vh;
                box-shadow: 3px 3px 3px 3px rgb(235, 235, 235);
                border-radius: 5px;
                border: none;
            }

            button{
                padding: 2vh;
                box-shadow: 3px 3px 3px 3px rgb(235, 235, 235);
                border-radius: 5px;
                border: none;
            }

            #results{
                min-width: 50vw;
                max-width: 50vw;
                margin-top: 4vh;
                box-shadow: 3px 3px 3px 3px rgb(235, 235, 235);
                border-radius: 15px;
                padding: 3vw;
                padding-top: 2vw;
                overflow: scroll;
                max-height: 50vh;
            }

            .word{
                display: inline-block;
                margin-top: 2vh;
                color: orange;
                font-size: 4vh;
            }

            .thingy{
                font-style: italic;
                color:rgb(124, 123, 123)
            }

            .pronounce{
                color: rgb(183, 183, 183);
                font-style: italic;
            }

            #footer{
                margin-top: 3vh;
            }

        </style> 
    
    </head>
  
    <body>

        <div id="title">Gen Z + Gen A Slang Dictionary</div>
        <div id="subtitle">A dictionary of popular Gen Zee and Gen Alpha terminology, dedicated to the adults in my life</div>
        <div>
            <input id="filterBox" type="checkbox" value="yes" checked onclick="filter()">
            <label for="filterBox">Hide adult terms and definitions</label>
        </div>

        <div>
            <input id="searchBar" type="text" placeholder="Search here...">
            <button id="searchBtn" onclick="search()">🔍</button>
        </div>

        <div id="results"></div>

        <div id="footer">More by me:<br>Personal Recipe Collection Github Itch.io</div>

    </body>

    <script>

        // variables
        let terms = []

    
        // read from file instead of the horrors of hardcode
        fetch('slang.json')
        .then(response => {
            if (!response.ok) {
                throw new Error("HTTP error " + response.status)
            }
            return response.json()
        })
        .then(data => {
            terms = data
            //console.log("Slang terms loaded successfully:", terms)
            search()
            })
        .catch(error => {
            console.error("Failed to load slang JSON file:", error);
        });


        // When page load
        window.onload = function() {
            search();
        }


        // detect searched word
        function search(){

            // variable declarations
            let term = document.getElementById('searchBar').value
            let results = document.getElementById('results')
            let filter = document.getElementById('filterBox').value

            let letters = term.split('')

            // clear results
            results.innerHTML = ""

            terms.forEach(word =>{
                word.match = 0;
            })

            // rank each word in the terms array
            letters.forEach(letter => {
                console.log(letter)

                terms.forEach(word => {

                    console.log(word.term)
                    if(word.term.includes(letter)){
                        
                        word.match = word.match + 1
                        //console.log(word.term + word.match)

                    } // if

                    if(word.term.toLowerCase().includes(term.toLowerCase())){

                        word.match = word.match + 2
                        //console.log("yes" + word.term + word.match) 

                    } // if

                }) // terms forEach

            }) // letters forEach

            // sort based on match
            terms.sort((a, b) => b.match - a.match)
            //console.log(terms)

            // output

            terms.forEach(word => {
                let megaString = ""
                let wordDiv = document.createElement("div")

                if(word.derog == false || filter == "no"){
                    //megaString += "<span class='word'>" + word.term + "</span>   <span class='pronounce'>" + word.pronounce + "</span><br>"
                    megaString += "<span class='word'>" + word.term + "</span><br>"

                    word.define.forEach(thing => {

                        if(filter == "no" || !thing.includes("​")){ // invisible character
                            megaString += thing + "<br>"
                        }

                    })

                    wordDiv.innerHTML = megaString
                    results.appendChild(wordDiv)

                } // if

            }) // terms forEach word output

        } // search()

        // the adult filter
        function filter(){
            let filter = document.getElementById('filterBox')

            if(filter.value == "no"){
                filter.value = "yes"
            } else if (filter.value == "yes"){
                filter.value = "no"
            }

            console.log(filter.value)
        } // filter()


        // event listeners
        let keyInput = document.getElementById('searchBar')

        keyInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault()
                
                console.log('Enter key was pressed!')
                search()
            }
        })

    
    </script>
  
</html>
